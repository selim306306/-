<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10243B">
<meta name="referrer" content="no-referrer">
<!-- سياسة الأمان: لو ظهرت رسالة "محجوب بواسطة سياسة الأمان" ولم يعمل شيء، احذف هذا السطر فقط. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src https://cdn.jsdelivr.net https://unpkg.com; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>مساعد المكتبة المدرسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
:root{
  --ink:#10243B; --ink2:#1D3A57; --paper:#EDF2F5; --card:#FFFFFF;
  --teal:#0E7C7B; --teal-d:#0A5E5D; --brass:#B8862B; --brick:#B23A2E;
  --line:#CBD6DE; --muted:#5B6E80;
  --ui:"Readex Pro",Tahoma,"Segoe UI",sans-serif; --head:"Reem Kufi","Readex Pro",Tahoma,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--ui);-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--head);margin:0;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.screen{min-height:100dvh}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}
.btn.primary:hover{background:var(--teal-d)}
.btn.danger{color:var(--brick);border-color:#e4bcb7}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],input[type=search],input[type=number],input:not([type]),select,textarea{
  width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
label{display:block;font-weight:500;margin:12px 0 4px}
small,.muted{color:var(--muted)}

/* ---------- lock ---------- */
#lock{display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--ink) 0 46%,var(--paper) 46% 100%)}
.lockcard{width:min(440px,100%);background:var(--card);border-radius:18px;padding:26px 22px;box-shadow:0 18px 50px rgba(16,36,59,.25)}
.lockcard h1{font-size:30px;line-height:1.3}
.lockcard .sub{color:var(--muted);margin:6px 0 10px}
.err{color:var(--brick);min-height:1.6em;margin:8px 0 0}
.env{list-style:none;margin:18px 0 0;padding:14px 0 0;border-top:1px solid var(--line);display:grid;gap:4px;font-size:14px}
.env li::before{content:"●";margin-inline-end:8px}
.env .ok::before{color:var(--teal)} .env .no::before{color:var(--brick)} .env .warn::before{color:var(--brass)}
.note{font-size:13.5px;background:#F3F6F8;border-radius:10px;padding:10px 12px;margin-top:12px;color:var(--muted)}

/* ---------- kiosk ---------- */
#kiosk{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100dvh}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--ink);color:#fff}
.brand{display:flex;align-items:center;gap:10px}
.brand strong{font-family:var(--head);font-size:21px;letter-spacing:.2px}
.mark{width:26px;height:30px;border-radius:3px 3px 3px 3px;background:linear-gradient(90deg,var(--brass) 0 22%,#fff 22% 100%);position:relative;display:inline-block}
.mark::after{content:"";position:absolute;inset:6px 5px 6px 9px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.bar-actions{display:flex;gap:6px}
.icon{width:44px;height:44px;border-radius:10px;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:#fff;display:grid;place-items:center}
.icon[aria-pressed=false]{opacity:.55}
.icon svg,.mic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stage{display:grid;grid-template-rows:auto 1fr;min-height:0;gap:10px;padding:10px 12px 0}
.cam{position:relative;width:100%;max-height:34dvh;aspect-ratio:4/3;margin-inline:auto;background:#0b1826;border-radius:var(--r);overflow:hidden}
.cam .mirror{position:absolute;inset:0;transform:scaleX(-1)}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam.off .mirror{opacity:.15}
.chip{position:absolute;inset-inline:10px;bottom:10px;padding:7px 12px;border-radius:999px;background:rgba(16,36,59,.86);color:#fff;font-size:15px;text-align:center;border:1.5px solid var(--brass)}
.chip.known{border-color:#3ecfcb}
.chip.guest{border-color:var(--line)}
.talk{min-height:0;display:flex;flex-direction:column}
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px;scroll-behavior:smooth}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:var(--card);border:1.5px solid var(--line);border-start-start-radius:4px}
.msg.me{align-self:flex-end;background:var(--ink2);color:#fff;border-start-end-radius:4px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:14px;padding:2px}
.interim{min-height:1.5em;color:var(--muted);font-size:15px;padding:0 4px}
.cards{display:grid;gap:8px;margin-top:8px}
.bookcard{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:10px 14px 10px 14px;padding-inline-start:34px;display:grid;gap:2px}
.bookcard::before{content:"";position:absolute;inset-inline-start:11px;top:50%;width:11px;height:11px;margin-top:-6px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line)}
.bookcard h3{font-size:18px;line-height:1.4;padding-bottom:4px;border-bottom:2px solid #d9a9a3}
.bookcard .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);padding-top:4px}
.shelf{border:1.5px solid var(--ink2);color:var(--ink2);border-radius:5px;padding:0 8px;font-weight:600}
.pill{border-radius:999px;padding:0 10px;font-size:13.5px;font-weight:500}
.pill.yes{background:#dcf1ef;color:var(--teal-d)} .pill.no{background:#f6dcd8;color:var(--brick)}
.bookcard .btn{justify-self:start;min-height:38px;margin-top:6px;padding:4px 14px}
.dock{padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:38px;padding:4px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14.5px}
.row{display:flex;gap:8px;align-items:center}
.mic{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--ink2);color:#fff;display:grid;place-items:center;position:relative}
.mic[aria-pressed=true]{background:var(--teal)}
.mic[aria-pressed=true]::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--teal);animation:pulse 1.6s ease-out infinite}
.mic:disabled{opacity:.4}
@keyframes pulse{from{transform:scale(.92);opacity:.9}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic[aria-pressed=true]::after{animation:none}.log{scroll-behavior:auto}}
@media (min-width:860px){
  .stage{grid-template-rows:none;grid-template-columns:minmax(320px,44%) 1fr;gap:16px;padding:16px 18px 0}
  .cam{max-height:none;height:min(62dvh,520px);width:100%;aspect-ratio:auto;align-self:start}
  .dock{padding-inline:18px}
}

/* ---------- overlays ---------- */
.veil{position:fixed;inset:0;background:rgba(16,36,59,.94);color:#fff;display:grid;place-items:center;text-align:center;padding:24px;z-index:50}
.veil .box{max-width:420px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:var(--brass);margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{position:fixed;inset-inline:14px;bottom:96px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:70;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}

/* ---------- admin ---------- */
.admin{position:fixed;inset:0;background:var(--paper);z-index:40;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);overflow:hidden}
.admin>header{background:var(--ink);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.admin h2{font-size:20px;margin-inline-end:auto}
.admin>header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1 1 100%;order:3;min-width:0}
.tabs button{flex:none;min-height:40px;padding:4px 16px;border-radius:9px;border:0;background:transparent;color:#cfe0ee}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);font-weight:600}
#adminBody{overflow:auto;padding:14px;max-width:900px;width:100%;margin-inline:auto}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{flex:1 1 180px;width:auto}
.item{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.item .grow{flex:1 1 200px;min-width:0}
.item .btn{min-height:38px;padding:2px 12px}
.item.late{border-color:#e4bcb7;background:#fdf3f1}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h3{font-size:19px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:10px 0}
.chk input{width:22px;height:22px;flex:none;margin-top:3px}
.mini{width:100%;max-width:340px;aspect-ratio:4/3;background:#0b1826;border-radius:12px;transform:scaleX(-1);object-fit:cover;display:block}
.guide{font-weight:500;color:var(--teal-d);min-height:1.7em}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
textarea{min-height:120px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.gate{position:fixed;inset:0;z-index:60;background:rgba(16,36,59,.7);display:grid;place-items:center;padding:16px}
.gate .lockcard{padding:20px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
</style>
</head>
<body>

<!-- ============ شاشة القفل / الإعداد الأول ============ -->
<main id="lock" class="screen">
  <div class="lockcard">
    <h1 id="lockTitle">مساعد المكتبة</h1>
    <p class="sub" id="lockSub"></p>
    <form id="lockForm" autocomplete="off">
      <label for="pw1" id="pw1l">كلمة مرور المكتبة</label>
      <input id="pw1" type="password" minlength="6" maxlength="100" required autocomplete="current-password">
      <div id="pw2wrap" hidden>
        <label for="pw2">تأكيد كلمة المرور</label>
        <input id="pw2" type="password" minlength="6" maxlength="100" autocomplete="new-password">
        <p class="note">تُشفَّر كل البيانات (الطلاب، بصمات الوجوه، الكتب، الإعارات) على هذا الجهاز فقط بكلمة المرور هذه. لا يمكن استرجاعها إن نُسيت، فاحفظها في مكان آمن ولا تشاركها مع الطلاب.</p>
      </div>
      <button class="btn primary" id="lockBtn" style="width:100%;margin-top:16px" type="submit">فتح</button>
      <p class="err" id="lockErr" role="alert"></p>
    </form>
    <ul class="env" id="env" aria-label="فحص جاهزية الجهاز"></ul>
  </div>
</main>

<!-- ============ الشاشة الرئيسية للمساعد ============ -->
<div id="kiosk" class="screen" hidden>
  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true"></span><strong id="brandName">مساعد المكتبة</strong></div>
    <div class="bar-actions">
      <button class="icon" id="btnFull" aria-label="ملء الشاشة"></button>
      <button class="icon" id="btnCam" aria-pressed="true" aria-label="تشغيل أو إيقاف الكاميرا"></button>
      <button class="icon" id="btnAdmin" aria-label="لوحة الإدارة"></button>
    </div>
  </header>
  <section class="stage">
    <div class="cam" id="camBox">
      <div class="mirror"><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div>
      <div class="chip" id="chip" aria-live="polite">جارٍ التجهيز…</div>
    </div>
    <div class="talk">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="interim" id="interim"></div>
    </div>
  </section>
  <footer class="dock">
    <div class="chips" id="quick"></div>
    <div class="row">
      <button class="mic" id="btnMic" aria-pressed="false" aria-label="تشغيل الميكروفون"></button>
      <input id="txt" type="text" maxlength="300" placeholder="اكتب سؤالك هنا…" enterkeyhint="send" autocomplete="off">
      <button class="btn primary" id="btnSend">إرسال</button>
    </div>
  </footer>
</div>

<!-- ============ لوحة الإدارة ============ -->
<div class="admin" id="admin" role="dialog" aria-modal="true" aria-label="لوحة الإدارة" hidden>
  <header>
    <h2>لوحة الإدارة</h2>
    <button class="btn" id="adminClose">إغلاق</button>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>
  <div id="adminBody"></div>
</div>

<div id="overlays"></div>

<!-- =====================================================================
     1) محرك الفهم اللغوي (عربي مصري/فصحى) — دوال نقية بدون واجهة
     ===================================================================== -->
<script id="core">
const NLU=(()=>{
  const DIG='٠١٢٣٤٥٦٧٨٩', PDIG='۰۱۲۳۴۵۶۷۸۹';
  function norm(s){
    return String(s==null?'':s).toLowerCase()
      .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
      .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
      .replace(/[٠-٩]/g,d=>DIG.indexOf(d)).replace(/[۰-۹]/g,d=>PDIG.indexOf(d))
      .replace(/[\u060C\u061B\u061F]/g,' ')
      .replace(/[^\u0600-\u06FFa-z0-9\s]/g,' ')
      .replace(/\s+/g,' ').trim();
  }
  const tok=s=>norm(s).split(' ').filter(Boolean);
  const SYN={'قصص':'قص','حكايات':'حكايه','علوم':'علم','كتب':'كتاب'};
  function stem(t){
    if(t.startsWith('ال')&&t.length>3) t=t.slice(2);
    if(SYN[t]) return SYN[t];
    if(t.length>4&&t.endsWith('ات')) t=t.slice(0,-2);
    else if(t.length>3&&t.endsWith('ه')) t=t.slice(0,-1);
    return t;
  }
  function near(a,b){
    if(a===b) return true;
    const la=a.length, lb=b.length; if(Math.abs(la-lb)>1) return false;
    let i=0,j=0,e=0;
    while(i<la&&j<lb){
      if(a[i]===b[j]){i++;j++;continue;}
      if(++e>1) return false;
      if(la>lb) i++; else if(lb>la) j++; else {i++;j++;}
    }
    return e+(la-i)+(lb-j)<=1;
  }
  const STOP=new Set(('في فيه عندكم عندك عندنا لو سمحت ممكن يا ده دي دا دول عن علي من الي ان هل كام ايه اي اللي بتاع بتاعه ليا لي انا نفسي حابب اريد ابغي عايز عايزه عاوز عاوزه محتاج محتاجه دور دورلي ابحث بحث هات هاتلي وريني اعرض كتاب كتب مؤلف تاليف كاتب للكاتب ليه بس طيب لما او و مع هو هي موجود متاح استعير استعاره اخد هاخد اعيرني اعير استلف اقترض سجل ارجع رجع اسلم رشح رشحلي اقترح فضلك تحب اقرا اقراه حاجه حاجات شويه عندكوا فيها فيهم كمان تاني').split(' ').map(norm));
  const qWords=n=>n.split(' ').filter(w=>w&&!STOP.has(w));
  function variants(w){
    const v=new Set([stem(w)]);
    if(w.length>3&&/^[لبو]/.test(w)) {const s=stem(w.slice(1)); if(s.length>=3) v.add(s);}
    if(w.startsWith('لل')&&w.length>4) v.add(stem('ال'+w.slice(2)));
    return [...v].filter(x=>x.length>=2);
  }
  function fieldScore(v,toks,w){
    let r=0;
    for(const t of toks){
      if(t===v) return w;
      if(v.length>=3&&t.startsWith(v)) r=Math.max(r,.75*w);
      else if(v.length>=4&&near(t,v)) r=Math.max(r,.6*w);
    }
    return r;
  }
  function search(query,S,limit=5){
    const ws=qWords(norm(query)); if(!ws.length) return [];
    const out=[];
    for(const b of S.books){
      const F={t:tok(b.title).map(stem),a:tok(b.author).map(stem),s:tok((b.subject||'')+' '+(b.keywords||'')).map(stem)};
      let total=0,hit=0;
      for(const w of ws){
        let best=0;
        for(const v of variants(w)) best=Math.max(best,fieldScore(v,F.t,2),fieldScore(v,F.a,1.5),fieldScore(v,F.s,1));
        if(best>0) hit++; total+=best;
      }
      const score=total/(ws.length*2);
      if(hit>=Math.ceil(ws.length/2)&&score>=0.3) out.push({book:b,score});
    }
    out.sort((x,y)=>y.score-x.score||x.book.title.localeCompare(y.book.title,'ar'));
    return out.slice(0,limit);
  }
  const activeLoans=(S,sid)=>S.loans.filter(l=>l.studentId===sid&&!l.returned);
  const avail=(S,b)=>b.copies-S.loans.filter(l=>l.bookId===b.id&&!l.returned).length;
  const isOverdue=(l,now=Date.now())=>!l.returned&&now>l.due;
  const bookById=(S,id)=>S.books.find(b=>b.id===id);
  const first=st=>String(st.name||'').trim().split(/\s+/)[0]||'';
  const fmtDate=ts=>new Date(ts).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const nCopies=a=>a===1?'نسخة واحدة':a===2?'نسختين':a<=10?a+' نسخ':a+' نسخة';
  function bookLine(b,S){
    const a=avail(S,b);
    return `«${b.title}»${b.author?'، تأليف '+b.author:''}${a>0?`، متاح ${nCopies(a)}`:'، كل النسخ معارة حالياً'}${b.shelf?`، على الرف ${b.shelf}`:''}`;
  }
  const say=(R,t)=>{R.say+=(R.say?' ':'')+t;return R;};
  const pick=a=>a[Math.floor(Math.random()*a.length)];

  const YES=/^(اه|ايوه|ايوا|اي|نعم|تمام|ماشي|اكيد|موافق|طبعا|يلا|اوكي|اوكيه|ok|okay|yes|ياريت|سجل|اتفضل|اكد)(\s|$)/;
  const NO=/^(لا|لاء|مش|الغي|الغاء|بلاش|كنسل|خلاص|no|لسه)(\s|$)/;
  const ORD=[[/(^|\s)(الاول|اول|الاولي|اولي|واحد|1)(\s|$)/,1],[/(^|\s)(التاني|الثاني|ثاني|تاني|الثانيه|اتنين|2)(\s|$)/,2],[/(^|\s)(التالت|الثالث|ثالث|تالت|الثالثه|تلاته|3)(\s|$)/,3]];
  const ordinal=n=>{for(const [re,k] of ORD) if(re.test(n)) return k; return 0;};
  const RE={
    salam:/(^|\s)(ال)?سلام عليكم/,
    thanks:/(شكرا|متشكر|تسلم|يسلمو|جزاك|ميرسي|مرسي)/,
    bye:/(مع السلامه|الي اللقاء|(^|\s)باي(\s|$)|(^|\s)سلام(\s|$)|همشي|تصبح علي خير|اشوفك)/,
    greet:/^(اهلا|مرحبا|هاي|هلو|صباح|مساء|ازيك|عامل ايه|اخبارك|ايه الاخبار)/,
    identity:/(انت مين|مين انت|اسمك|بتعمل ايه|تقدر تعمل ايه|تعرف تعمل ايه)|^(ساعدني|مساعده)$/,
    whoami:/(انا مين|اسمي ايه|تعرفني|عارفني)/,
    hours:/(مواعيد|ساعات (العمل|الدوام)|بتفتحو|بتقفلو|تفتحو|تقفلو|فاتحه|مفتوحه|الدوام)/,
    rules:/(شروط|قواعد|قوانين|غرامه|مده الاستعاره|كام يوم|اقصي عدد|كام كتاب|عدد الكتب)/,
    myloans:/(استعرت|كتبي|اللي معايا|الكتب اللي (معايا|عندي)|موعد (التسليم|الارجاع|الرد|الرجوع)|ارجعهم امتي|ارجع امتي|متاخر)/,
    ret:/(ارجع|رجع|ارجاع|اسلم|تسليم|ارد كتاب|رد كتاب)/,
    borrow:/(استعير|استعاره|اعيرني|اعير|هاخد|اخد كتاب|عايز اخد|عاوز اخد|اقترض|استلف|اشيل كتاب)/,
    recommend:/(رشح|اقترح|نصيح|ايه احسن|حاجه حلوه|كتاب حلو|كتاب كويس|اقرا ايه|اقرا اي)/,
    time:/(الساعه كام|الساعه كم|التاريخ كام|تاريخ النهارده|التاريخ النهارده|النهارده ايه|النهارده كام|يوم ايه)/,
    joke:/(نكته|هزار|فرفشني|اضحكني)/,
    bookish:/(كتاب|كتب|روايه|روايات|قصه|قصص|مؤلف|كاتب|ديوان|موسوعه|عندكم|عندك|عايز|عاوز|محتاج|دور|ابحث|هات)/
  };
  const JOKES=['مرة واحد سأل أمين المكتبة: عندك كتاب عن الصبر؟ قاله: أيوه، بس متاخد من أسبوعين وماحدش رجّعه.','ليه الكتاب ماكانش بيزعل أبداً؟ لأن أي حد بيقلّب صفحته بيرجع يفتحه تاني.','قالوا لواحد: مالك بتقرا كتاب مقلوب؟ قال: أصلي عايز أعرف النهاية الأول.'];
  const UNKNOWN=['معلش مفهمتش قصدك. تقدر تسألني عن كتاب، أو تقول "عايز أستعير…"، أو تسأل عن مواعيد المكتبة.','مش متأكد إني فهمتك. جرّب تقولي اسم كتاب أو مؤلف، أو اسأل "تقدر تعمل إيه؟".'];

  function greeting(st,S,d,repeat){
    const h=d.getHours(), tod=h<5?'مساء الخير':h<12?'صباح الخير':h<17?'نهارك سعيد':'مساء الخير';
    const lib=S.settings.libraryName, bot=S.settings.botName;
    if(!st) return `${tod}! أهلاً بيك في ${lib}. أنا ${bot}، اسألني عن أي كتاب. وعشان أسجل استعارة لازم أتعرف عليك بوشك.`;
    const f=st.gender==='f', nm=first(st);
    if(repeat) return `أهلاً بيك${f?'ي':''} تاني يا ${nm}! تحب${f?'ي':''} أساعدك في إيه؟`;
    let s=`${tod} يا ${nm}! نور${f?'تي':'ت'} ${lib}.`;
    const mine=activeLoans(S,st.id), now=d.getTime();
    const late=mine.find(l=>isOverdue(l,now));
    if(late){const b=bookById(S,late.bookId); if(b) s+=` عندك كتاب متأخر: «${b.title}»، ياريت ترجعه لأمين المكتبة.`;}
    else{const soon=mine.filter(l=>l.due-now<2*86400000).sort((a,b)=>a.due-b.due)[0];
      if(soon){const b=bookById(S,soon.bookId); if(b) s+=` وكتاب «${b.title}» موعد رجوعه ${fmtDate(soon.due)}.`;}}
    return s+` تحب${f?'ي':''} أساعدك في إيه؟`;
  }

  function showBook(b,S,R){R.books=[b.id];return say(R,'لقيت '+bookLine(b,S)+'.');}
  function notFound(raw,ses,R){
    say(R,'مش لاقي كتاب بالوصف ده في المكتبة. تحب أسجل طلب لأمين المكتبة عشان يفكر يجيبه؟');
    ses.pending={type:'confirm',kind:'request',text:String(raw).slice(0,120)};
    return R;
  }
  function searchReply(raw,ses,S,R,forceNotFound){
    const res=search(raw,S);
    if(!res.length) return forceNotFound?notFound(raw,ses,R):null;
    const top=res.slice(0,3); R.books=top.map(x=>x.book.id);
    if(top.length===1||top[0].score>=top[1].score*1.5) {R.books=[top[0].book.id]; return say(R,'لقيت '+bookLine(top[0].book,S)+'.');}
    say(R,`لقيت ${res.length>3?'أكتر من 3':res.length} كتب مناسبة: `+top.map((x,i)=>`${['الأول','التاني','التالت'][i]}: ${bookLine(x.book,S)}`).join('. ')+'.');
    return R;
  }
  function doBorrow(b,ses,S,R){
    const st=ses.student;
    if(!st){
      ses.deferred={action:'borrow',bookId:b.id};
      if(S.settings.codeLogin){ses.pending={type:'code'};return say(R,'عشان أسجل الاستعارة لازم أعرفك. قولي كود الطالب بتاعك، أو قرّب وشك من الكاميرا.');}
      return say(R,'عشان أسجل الاستعارة لازم أتعرف عليك بوشك. قرّب وشك من الكاميرا شوية وأنا أكمل معاك.');
    }
    const mine=activeLoans(S,st.id), now=Date.now();
    if(S.settings.blockIfOverdue&&mine.some(l=>isOverdue(l,now))) return say(R,'عندك كتاب متأخر في الإرجاع. رجّعه لأمين المكتبة الأول وبعدين تقدر تستعير تاني.');
    if(mine.length>=S.settings.maxLoans) return say(R,`وصلت للحد الأقصى وهو ${S.settings.maxLoans} كتب. رجّع كتاب الأول.`);
    if(mine.some(l=>l.bookId===b.id)) return say(R,'الكتاب ده معاك بالفعل.');
    if(avail(S,b)<=0){
      const next=S.loans.filter(l=>l.bookId===b.id&&!l.returned).sort((x,y)=>x.due-y.due)[0];
      R.books=[b.id];
      return say(R,`كل نسخ «${b.title}» معارة حالياً${next?`، وأقرب نسخة المفروض ترجع ${fmtDate(next.due)}`:''}.`);
    }
    ses.pending={type:'confirm',kind:'borrow',bookId:b.id}; R.books=[b.id];
    return say(R,`تمام يا ${first(st)}. أسجل استعارة «${b.title}» لمدة ${S.settings.loanDays} يوم؟`);
  }
  function finishBorrow(id,ses,S,R){
    const b=bookById(S,id), st=ses.student;
    if(!b||!st) return say(R,'حصلت مشكلة، جرّب تاني.');
    if(avail(S,b)<=0) return say(R,'للأسف النسخة اتاخدت قبل ما أسجلها.');
    const out=Date.now(), due=out+S.settings.loanDays*86400000;
    S.loans.push({id:uid(),studentId:st.id,bookId:b.id,out,due,returned:null});
    S.log.push({t:out,type:'loan',studentId:st.id,bookId:b.id}); if(S.log.length>400) S.log.splice(0,S.log.length-400);
    R.dirty=true;
    return say(R,`تم! «${b.title}» عندك لحد ${fmtDate(due)}. استلمه من أمين المكتبة، ومتنساش ترجعه في معاده.`);
  }
  function finishRequest(p,ses,S,R){
    S.requests=S.requests||[]; S.requests.push({id:uid(),text:p.text,studentId:ses.student?ses.student.id:null,at:Date.now()});
    R.dirty=true; return say(R,'اتسجل الطلب، وأمين المكتبة هيشوفه.');
  }
  function resume(ses,S){
    const R={say:'',books:[],dirty:false,identified:null};
    const d=ses.deferred; if(!d||!ses.student) return R;
    ses.deferred=null;
    if(d.action==='borrow'){const b=bookById(S,d.bookId); if(b) doBorrow(b,ses,S,R);}
    return R;
  }
  function handleBorrowQuery(n,raw,ses,S,R){
    const res=search(n,S);
    if(!res.length) return notFound(raw,ses,R);
    if(res.length===1||res[0].score>=res[1].score*1.35) return doBorrow(res[0].book,ses,S,R);
    const top=res.slice(0,3); R.books=top.map(x=>x.book.id);
    ses.pending={type:'choose',action:'borrow',ids:top.map(x=>x.book.id)};
    return say(R,'تقصد أنهي كتاب؟ '+top.map((x,i)=>`${['الأول','التاني','التالت'][i]}: «${x.book.title}»`).join('، ')+'.');
  }
  function resolvePending(p,n,raw,ses,S,R){
    if(p.type==='confirm'){
      if(YES.test(n)) return p.kind==='borrow'?finishBorrow(p.bookId,ses,S,R):finishRequest(p,ses,S,R);
      if(NO.test(n)) return say(R,'تمام، ألغيت.');
      return null;
    }
    if(p.type==='choose'){
      let id=null; const o=ordinal(n);
      if(o&&p.ids[o-1]) id=p.ids[o-1];
      else{const res=search(n,S).filter(x=>p.ids.includes(x.book.id)); if(res.length===1||(res.length>1&&res[0].score>res[1].score*1.3)) id=res[0].book.id;}
      if(!id) return NO.test(n)?say(R,'تمام، ألغيت.'):null;
      return doBorrow(bookById(S,id),ses,S,R);
    }
    if(p.type==='title') return handleBorrowQuery(n,raw,ses,S,R);
    if(p.type==='code'){
      if(NO.test(n)){ses.deferred=null;return say(R,'تمام، ألغيت.');}
      const m=n.match(/\d{3,}/); if(!m) return null;
      const st=S.students.find(s=>String(s.code)===m[0]);
      if(!st){ses.pending=p;return say(R,'الكود ده مش متسجل عندي. جرّب تاني أو قرّب وشك من الكاميرا.');}
      ses.student=st; R.identified=st; say(R,`أهلاً يا ${first(st)}!`);
      const r2=resume(ses,S); say(R,r2.say); R.books=r2.books; R.dirty=r2.dirty; return R;
    }
    return null;
  }

  function respond(raw,ses,S){
    const R={say:'',books:[],dirty:false,identified:null};
    const n=norm(raw), cfg=S.settings;
    if(!n) return say(R,'مسمعتش حاجة واضحة، ممكن تعيد؟');
    if(ses.pending){
      const p=ses.pending; ses.pending=null;
      const r=resolvePending(p,n,raw,ses,S,R); if(r) return r;
    }
    if(RE.salam.test(n)) return say(R,'وعليكم السلام ورحمة الله وبركاته! أقدر أساعدك في إيه؟');
    if(RE.thanks.test(n)) return say(R,pick(['العفو! أي خدمة.','تحت أمرك في أي وقت.']));
    if(RE.bye.test(n)) return say(R,'مع السلامة! نورتنا.');
    if(RE.greet.test(n)&&n.split(' ').length<=4) return say(R,pick(['أهلاً بيك! أقدر أساعدك في إيه؟','الحمد لله تمام، وحضرتك؟ تحب أدورلك على كتاب؟']));
    if(RE.identity.test(n)) return say(R,`أنا ${cfg.botName}، مساعد ${cfg.libraryName}. بدور على الكتب وأقولك هي فين ومتاحة ولا لأ، وأسجّل الاستعارة، وأقولك على كتبك ومواعيد رجوعها، وأرشحلك كتب.`);
    if(RE.whoami.test(n)) return say(R,ses.student?`إنت ${ses.student.name}${ses.student.cls?'، '+ses.student.cls:''}.`:'لسه مش متعرف عليك. قرّب وشك من الكاميرا وأنا هعرفك لو إنت مسجل عندنا.');
    if(RE.hours.test(n)) return say(R,cfg.hours?`مواعيد المكتبة: ${cfg.hours}.`:'مواعيد المكتبة لسه مش متسجلة عندي، اسأل أمين المكتبة.');
    if(RE.rules.test(n)) return say(R,`تقدر تستعير لحد ${cfg.maxLoans} كتب في نفس الوقت، ومدة الاستعارة ${cfg.loanDays} يوم.${cfg.blockIfOverdue?' ولو عندك كتاب متأخر مش هتقدر تستعير غير لما ترجّعه.':''} الإرجاع بيتم عن طريق أمين المكتبة.`);
    if(RE.myloans.test(n)||(RE.ret.test(n)&&!/(كتاب|روايه|قصه)\s+\S/.test(n))){
      if(!ses.student) return say(R,'محتاج أتعرف عليك الأول عشان أقولك على كتبك. قرّب وشك من الكاميرا.');
      const ls=activeLoans(S,ses.student.id).sort((a,b)=>a.due-b.due), now=Date.now();
      if(!ls.length) return say(R,'مفيش كتب معاك دلوقتي.');
      R.books=ls.map(l=>l.bookId);
      say(R,`معاك ${ls.length===1?'كتاب واحد':ls.length+' كتب'}: `+ls.map(l=>{const b=bookById(S,l.bookId); return `«${b?b.title:'كتاب محذوف'}» ${isOverdue(l,now)?'متأخر، كان المفروض يرجع '+fmtDate(l.due):'يرجع قبل '+fmtDate(l.due)}`;}).join('. ')+'.');
      if(RE.ret.test(n)) say(R,'وعشان ترجّع كتاب، سلّمه لأمين المكتبة وهو هيسجّل الإرجاع.');
      return R;
    }
    if(RE.ret.test(n)) return say(R,'الإرجاع بيتم عن طريق أمين المكتبة، سلّمه الكتاب وهو هيسجّله.');
    if(RE.borrow.test(n)){
      if(!qWords(n).length){ses.pending={type:'title'};return say(R,'أنهي كتاب تحب تستعيره؟ قولي اسمه أو اسم مؤلفه.');}
      return handleBorrowQuery(n,raw,ses,S,R);
    }
    if(RE.recommend.test(n)){
      if(qWords(n).length){const r=searchReply(raw,ses,S,R,false); if(r) return r;}
      const mineIds=new Set(ses.student?S.loans.filter(l=>l.studentId===ses.student.id).map(l=>l.bookId):[]);
      const pool=S.books.filter(b=>avail(S,b)>0&&!mineIds.has(b.id)).sort(()=>Math.random()-.5).slice(0,3);
      if(!pool.length) return say(R,'مفيش كتب متاحة أرشحها دلوقتي.');
      R.books=pool.map(b=>b.id);
      return say(R,'أرشحلك: '+pool.map(b=>`«${b.title}»${b.author?' تأليف '+b.author:''}`).join('، ')+'.');
    }
    if(RE.time.test(n)){const d=new Date(); return say(R,`النهارده ${fmtDate(d)}، والساعة ${d.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})}.`);}
    if(RE.joke.test(n)) return say(R,pick(JOKES));
    if(cfg.codeLogin&&/(كود|رقم)/.test(n)){
      const m=n.match(/\d{3,}/), st=m&&S.students.find(s=>String(s.code)===m[0]);
      if(st){ses.student=st;R.identified=st;say(R,`أهلاً يا ${first(st)}!`);const r2=resume(ses,S);say(R,r2.say);R.dirty=r2.dirty;return R;}
      return say(R,'الكود ده مش متسجل عندي.');
    }
    const r=searchReply(raw,ses,S,R,RE.bookish.test(n)); if(r) return r;
    return say(R,pick(UNKNOWN));
  }
  return {norm,search,respond,resume,greeting,avail,activeLoans,isOverdue,first,fmtDate,uid,bookById};
})();
if(typeof module!=='undefined') module.exports=NLU;
</script>

<script id="app">
'use strict';
(()=>{
/* ---------- أدوات عامة ---------- */
const $=(s,r=document)=>r.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clean=(s,max=200)=>String(s==null?'':s).replace(/[\u0000-\u001F\u007F]/g,' ').replace(/\s+/g,' ').trim().slice(0,max);
function h(sel,props,...kids){
  const m=/^([a-z0-9]+)(.*)$/i.exec(sel), el=document.createElement(m[1]);
  for(const c of m[2].matchAll(/([.#])([\w-]+)/g)) c[1]==='.'?el.classList.add(c[2]):(el.id=c[2]);
  if(props&&typeof props==='object'&&!(props instanceof Node)&&!Array.isArray(props)){
    for(const [k,v] of Object.entries(props)){
      if(v==null||v===false) continue;
      if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2),v);
      else if(k==='value') el.value=v;
      else if(k==='checked') el.checked=!!v;
      else el.setAttribute(k,v===true?'':v);
    }
  } else if(props!=null) kids.unshift(props);
  for(const k of kids.flat(Infinity)){ if(k==null||k===false) continue; el.append(k instanceof Node?k:document.createTextNode(String(k))); }
  return el;
}
function sel(options,value){const s=h('select',null,options.map(([v,t])=>h('option',{value:v},t))); s.value=value; return s;}
const field=(label,input,hint)=>h('div',null,h('label',null,label),input,hint?h('small',null,hint):null);
function toast(msg,ms=3800){const t=h('div.toast',{role:'status'},msg);document.body.append(t);setTimeout(()=>t.remove(),ms);}
const ICON={
  mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  cam:'<svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
  full:'<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'
};
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);};
const b64d=t=>{const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;};
const csvCell=v=>{let s=String(v==null?'':v); if(/^[=+\-@\t\r]/.test(s)) s="'"+s; return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
function download(name,text,type){const a=h('a',{href:URL.createObjectURL(new Blob([text],{type})),download:name});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','||c==='\t'||c==='؛'||c===';'){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur);cur=''; if(row.some(x=>x.trim())) rows.push(row); row=[]; }
    else cur+=c;
  }
  row.push(cur); if(row.some(x=>x.trim())) rows.push(row);
  return rows;
}
window.addEventListener('securitypolicyviolation',e=>toast('حجبت سياسة الأمان: '+clean(e.blockedURI,60)+' — راجع التعليق في أعلى الملف',8000));

/* ---------- التشفير والتخزين (IndexedDB + AES-GCM) ---------- */
let dbp=null;
const idb=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('school-lib-assistant',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
const idbGet=async k=>{const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});};
const idbSet=async(k,v)=>{const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});};
const idbDel=async k=>{const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});};

const Vault={
  key:null,salt:null,iters:250000,queue:Promise.resolve(),timer:null,
  async derive(pw,salt,iters){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iters,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  },
  async open(rec,pw){
    const key=await this.derive(pw,b64d(rec.salt),rec.iters);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(rec.iv)},key,b64d(rec.ct));
    return {key,data:JSON.parse(new TextDecoder().decode(pt))};
  },
  async seal(data){
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},this.key,new TextEncoder().encode(JSON.stringify(data)));
    return {v:1,salt:b64e(this.salt),iters:this.iters,iv:b64e(iv),ct:b64e(new Uint8Array(ct))};
  },
  save(){ // مؤجَّل ومتسلسل لتفادي التعارض
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>{this.queue=this.queue.then(async()=>{try{await idbSet('vault',await this.seal(S));}catch(e){console.error(e);toast('تعذّر حفظ البيانات: '+(e.name||'خطأ'));}});},350);
  },
  flush(){clearTimeout(this.timer);const p=this.queue.catch(()=>{}).then(async()=>{await idbSet('vault',await this.seal(S));});this.queue=p.catch(()=>{});return p;}
};

/* ---------- الصوت: نطق + تعرّف ---------- */
const Voice={
  voice:null,speaking:false,timer:null,tok:0,cur:null,
  init(){
    if(!('speechSynthesis' in window)) return;
    const pick=()=>{const vs=speechSynthesis.getVoices();const want=S.settings.voiceLang.toLowerCase();
      this.voice=vs.find(v=>v.lang.replace('_','-').toLowerCase()===want)||vs.find(v=>v.lang.toLowerCase().startsWith('ar'))||null;};
    pick(); speechSynthesis.addEventListener('voiceschanged',pick);
  },
  cancel(){this.tok++;try{speechSynthesis.cancel();}catch(e){}clearTimeout(this.timer);this.speaking=false;const r=this.cur;this.cur=null;if(r)r();},
  speak(text){
    return new Promise(res=>{
      if(!S.settings.speak||!('speechSynthesis' in window)){res();return;}
      this.cancel(); this.cur=res; Ear.pause();
      const t=String(text).replace(/[«»"]/g,'').replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,'');
      const parts=t.match(/[^.!؟?]+[.!؟?]?/g)||[t], chunks=[]; let cur='';
      for(const p of parts){ if((cur+p).length>170&&cur){chunks.push(cur);cur=p;} else cur+=p; } if(cur.trim()) chunks.push(cur);
      const my=++this.tok; let i=0; this.speaking=true;
      const done=()=>{if(my!==this.tok)return;this.speaking=false;clearTimeout(this.timer);const r=this.cur;this.cur=null;if(r)r();};
      const next=()=>{
        if(my!==this.tok) return; if(i>=chunks.length){done();return;}
        const u=new SpeechSynthesisUtterance(chunks[i++]);
        u.lang=this.voice?this.voice.lang:S.settings.voiceLang; if(this.voice)u.voice=this.voice; u.rate=S.settings.rate;
        u.onend=next; u.onerror=next; speechSynthesis.speak(u);
      };
      this.timer=setTimeout(done,Math.max(4000,t.length*140));
      next();
    });
  }
};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const Ear={
  rec:null,want:false,running:false,supported:!!SR,denied:false,
  init(){
    if(!SR) return;
    const r=new SR(); r.lang=S.settings.voiceLang; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
    r.onstart=()=>{this.running=true;};
    r.onresult=e=>{
      let interim='',fin='';
      for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];(x.isFinal?(fin+=x[0].transcript):(interim+=x[0].transcript));}
      $('#interim').textContent=interim||'';
      if(fin.trim()){$('#interim').textContent='';App.ask(fin.trim());}
    };
    r.onerror=e=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){this.want=false;this.denied=true;UI.mic(false);toast('لم يُسمح باستخدام الميكروفون. فعّل الإذن من إعدادات المتصفح.',6000);}
      else if(e.error==='network'){toast('التعرّف على الصوت يحتاج اتصال إنترنت.');}
    };
    r.onend=()=>{this.running=false;$('#interim').textContent='';if(this.want&&!Voice.speaking)setTimeout(()=>this.begin(),300);};
    this.rec=r;
  },
  begin(){if(!this.want||this.running||!this.rec||Voice.speaking)return;try{this.rec.lang=S.settings.voiceLang;this.rec.start();}catch(e){}},
  enable(){this.want=true;this.denied=false;this.begin();},
  disable(){this.want=false;try{this.rec&&this.rec.abort();}catch(e){}},
  pause(){try{this.rec&&this.rec.abort();}catch(e){}}
};

/* ---------- الرؤية: كاميرا + تعرّف على الوجه ---------- */
const FACE_SRC=['https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js','https://unpkg.com/@vladmandic/face-api/dist/face-api.js'];
const MODEL_URL=['https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/','https://unpkg.com/@vladmandic/face-api/model/'];
const loadScript=urls=>urls.reduce((p,u)=>p.catch(()=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.async=true;s.onload=res;s.onerror=()=>{s.remove();rej(new Error('script '+u));};document.head.append(s);})),Promise.reject());
const euclid=(a,b)=>{let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d;}return Math.sqrt(s);};
function classify(desc){
  let best={id:null,d:9},second=9;
  for(const s of S.students){
    let m=9; for(const f of (FACES.get(s.id)||[])){const d=euclid(desc,f);if(d<m)m=d;}
    if(m<best.d){second=best.d;best={id:s.id,d:m};} else if(m<second) second=m;
  }
  if(best.id&&best.d<=S.settings.threshold&&(second-best.d)>=0.03) return best;
  return {id:null,d:best.d};
}
const Vision={
  video:null,stream:null,opts:null,ready:false,running:false,paused:false,timer:null,camOn:false,
  async loadModels(){
    await loadScript(FACE_SRC);
    if(!window.faceapi) throw new Error('faceapi');
    let ok=false,err;
    for(const u of MODEL_URL){
      try{await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(u),faceapi.nets.faceLandmark68TinyNet.loadFromUri(u),faceapi.nets.faceRecognitionNet.loadFromUri(u)]);ok=true;break;}catch(e){err=e;}
    }
    if(!ok) throw err;
    this.opts=new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5});
    this.ready=true;
  },
  async startCamera(){
    if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('insecure');
    this.video=$('#video');
    this.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    this.video.srcObject=this.stream; this.video.muted=true;
    await this.video.play();
    this.camOn=true; $('#camBox').classList.remove('off');
  },
  stopCamera(){
    this.running=false; clearTimeout(this.timer);
    if(this.stream) this.stream.getTracks().forEach(t=>t.stop());
    this.stream=null; if(this.video) this.video.srcObject=null; this.camOn=false;
    $('#camBox').classList.add('off'); this.clearOverlay();
  },
  clearOverlay(){const c=$('#overlay');c.getContext('2d').clearRect(0,0,c.width,c.height);},
  run(){if(this.running||!this.ready||!this.camOn)return;this.running=true;this.tick();},
  async tick(){
    if(!this.running) return;
    const t0=performance.now();
    try{
      if(!this.paused&&!document.hidden&&this.video.readyState>=2){
        const needDesc=App.needDescriptors(); let dets;
        const q=faceapi.detectAllFaces(this.video,this.opts);
        dets=needDesc?await q.withFaceLandmarks(true).withFaceDescriptors():await q;
        const list=dets.map(d=>{const box=(d.detection||d).box;return {box,area:box.width*box.height,descriptor:d.descriptor||null};});
        this.draw(list); App.onFaces(list);
      }
    }catch(e){console.warn('detect',e);}
    this.timer=setTimeout(()=>this.tick(),Math.max(150,450-(performance.now()-t0)));
  },
  draw(list){
    const c=$('#overlay'),v=this.video; if(!v.videoWidth) return;
    if(c.width!==v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;}
    const g=c.getContext('2d'); g.clearRect(0,0,c.width,c.height);
    const known=App.session&&App.session.student, col=known?'#3ecfcb':(App.session?'#e6e9ec':'#B8862B');
    g.strokeStyle=col; g.lineWidth=Math.max(3,c.width/160); g.lineCap='round';
    for(const f of list){
      const {x,y,width:w,height:hh}=f.box, L=Math.min(w,hh)*0.22;
      g.beginPath();
      [[x,y,1,1],[x+w,y,-1,1],[x,y+hh,1,-1],[x+w,y+hh,-1,-1]].forEach(([px,py,dx,dy])=>{g.moveTo(px+dx*L,py);g.lineTo(px,py);g.lineTo(px,py+dy*L);});
      g.stroke();
    }
  },
  async captureOne(){ // عينة واحدة للتسجيل
    if(!this.ready||!this.camOn) return {ok:false,msg:'الكاميرا غير جاهزة'};
    const dets=await faceapi.detectAllFaces(this.video,this.opts).withFaceLandmarks(true).withFaceDescriptors();
    if(dets.length===0) return {ok:false,msg:'لا أرى وجهاً — قرّب من الكاميرا'};
    if(dets.length>1) return {ok:false,msg:'يجب أن يظهر شخص واحد فقط'};
    if(dets[0].detection.box.width/this.video.videoWidth<0.2) return {ok:false,msg:'قرّب أكثر من الكاميرا'};
    const d=dets[0].descriptor; return {ok:true,b64:b64e(new Uint8Array(d.buffer,d.byteOffset,d.byteLength)),desc:d};
  }
};

/* ---------- المنسّق: الجلسة + المحادثة ---------- */
const App={
  session:null,votes:[],lastFaceAt:0,lastActivity:0,lastVerify:0,verifyMiss:0,lastGreeted:new Map(),micOn:false,
  needDescriptors(){return !this.session||Date.now()-this.lastVerify>10000;},
  leaveMs(){return Vision.camOn?15000:120000;},
  onFaces(list){
    const now=Date.now();
    if(!list.length){this.idle(now);return;}
    this.lastFaceAt=now;
    const f=list.reduce((a,b)=>a.area>=b.area?a:b);
    if(f.box.width/Vision.video.videoWidth<0.16){if(!this.session)UI.chip('قرّب من الكاميرا شوية','');return;}
    if(!f.descriptor) return;
    const c=classify(f.descriptor);
    if(!this.session){
      this.votes.push(c.id||'?'); if(this.votes.length>5)this.votes.shift();
      const last3=this.votes.slice(-3);
      if(last3.length===3&&last3[0]!=='?'&&last3.every(v=>v===last3[0])){this.votes=[];this.startSession(studentById(last3[0]));}
      else if(this.votes.length>=5&&this.votes.filter(v=>v==='?').length>=4){this.votes=[];this.startSession(null);}
      else UI.chip('بتعرّف عليك…','');
      return;
    }
    this.lastVerify=now;
    const cur=this.session.student;
    if(cur){
      if(c.id===cur.id) this.verifyMiss=0;
      else{this.verifyMiss++;this.lastVerify=now-8000;if(this.verifyMiss>=3){this.endSession('changed');}}
    } else if(c.id){ this.upgrade(studentById(c.id)); }
  },
  idle(now){
    if(!this.session){this.votes=[];UI.chip(Vision.camOn?'مستنيك تقرّب من الكاميرا…':'الكاميرا مقفولة — اكتب أو اتكلم','');return;}
    if(now-Math.max(this.lastFaceAt,this.lastActivity)>this.leaveMs()) this.endSession('left');
  },
  async startSession(st){
    const now=Date.now(),cool=S.settings.greetCooldownMin*60000;
    this.session={student:st,pending:null,deferred:null,startedAt:now};
    this.lastActivity=now; this.lastVerify=now; this.verifyMiss=0;
    const repeat=!!st&&now-(this.lastGreeted.get(st.id)||0)<cool;
    if(st) this.lastGreeted.set(st.id,now);
    pushLog('visit',{studentId:st?st.id:null,guest:!st}); persist();
    UI.session();
    const text=NLU.greeting(st,S,new Date(),repeat);
    UI.bot({say:text,books:[]});
    if(this.micOn) Ear.want=true;
    await Voice.speak(text); Ear.begin();
  },
  async upgrade(st){
    this.session.student=st; this.verifyMiss=0; this.lastGreeted.set(st.id,Date.now());
    UI.session();
    const text=NLU.greeting(st,S,new Date(),false); UI.bot({say:text,books:[]});
    let R=NLU.resume(this.session,S); let out=text;
    if(R.say){UI.bot(R);out+=' '+R.say;if(R.dirty)persist();}
    await Voice.speak(out); Ear.begin();
  },
  endSession(why){
    if(!this.session) return;
    Voice.cancel(); Ear.pause();
    UI.sys(why==='changed'?'ظهر شخص آخر — بدأت جلسة جديدة':'انتهت الجلسة');
    this.session=null; this.votes=[]; this.verifyMiss=0; UI.session();
  },
  ensureSession(){
    if(this.session) return;
    this.session={student:null,pending:null,deferred:null,startedAt:Date.now()};
    UI.session();
  },
  async ask(text){
    text=clean(text,300); if(!text) return;
    this.ensureSession(); this.lastActivity=Date.now();
    UI.me(text);
    const R=NLU.respond(text,this.session,S);
    if(R.identified) UI.session();
    if(R.dirty){pushLog('assist',{studentId:this.session.student?this.session.student.id:null});persist();}
    UI.bot(R);
    await Voice.speak(R.say); this.lastActivity=Date.now(); Ear.begin();
  }
};

function editStudent(s){

function envReport(){

    li(!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),'الكاميرا'),

    li('speechSynthesis' in window,'النطق الصوتي'),

const lockErr=t=>{$('#lockErr').textContent=t;};
let failures=0,lockedUntil=0;
async function boot(){
  envReport();
  let rec=null; try{rec=await idbGet('vault');}catch(e){lockErr('تعذّر فتح التخزين على هذا المتصفح (ربما وضع التصفح الخاص).');$('#lockBtn').disabled=true;return;}
  const fresh=!rec;
  $('#pw2wrap').hidden=!fresh; $('#pw2').required=fresh;
  $('#lockSub').textContent=fresh?'إعداد أول مرة: اختر كلمة مرور لحماية بيانات المكتبة.':'أدخل كلمة المرور لفتح المكتبة.';
  $('#lockBtn').textContent=fresh?'إنشاء وبدء':'فتح'; $('#pw1').autocomplete=fresh?'new-password':'current-password';
  $('#lockForm').addEventListener('submit',async e=>{
    e.preventDefault(); lockErr('');
    const pw=$('#pw1').value, btn=$('#lockBtn');
    if(Date.now()<lockedUntil) return lockErr(`انتظر ${Math.ceil((lockedUntil-Date.now())/1000)} ثانية قبل المحاولة.`);
    if(pw.length<6) return lockErr('كلمة المرور يجب ألا تقل عن 6 أحرف.');
    btn.disabled=true;
    try{
      if(fresh){
        if(pw!==$('#pw2').value){btn.disabled=false;return lockErr('كلمتا المرور غير متطابقتين.');}
        S=defaultState(); Vault.salt=crypto.getRandomValues(new Uint8Array(16)); Vault.key=await Vault.derive(pw,Vault.salt,Vault.iters);
        await Vault.flush();
      }else{
        const {key,data}=await Vault.open(rec,pw); S=data; Vault.key=key; Vault.salt=b64d(rec.salt); Vault.iters=rec.iters;
      }
    }catch(x){
      btn.disabled=false; failures++; if(failures>=5){lockedUntil=Date.now()+30000;failures=0;}
      return lockErr('كلمة المرور غير صحيحة.');
    }
    S.settings=Object.assign(defaultState().settings,S.settings); S.requests=S.requests||[]; S.log=S.log||[];
    $('#pw1').value='';$('#pw2').value='';
    buildFaces(); start();
  });
}
async function start(){
  $('#lock').hidden=true; $('#kiosk').hidden=false; $('#brandName').textContent=S.settings.libraryName;
  $('#btnFull').innerHTML=ICON.full;$('#btnCam').innerHTML=ICON.cam;$('#btnAdmin').innerHTML=ICON.gear;$('#btnMic').innerHTML=ICON.mic;
  const quick=['مواعيد المكتبة','رشّح لي كتاب','كتبي المستعارة','شروط الاستعارة','تقدر تعمل إيه؟'];
  $('#quick').replaceChildren(...quick.map(q=>h('button',{onclick:()=>App.ask(q)},q)));
  Voice.init(); Ear.init();
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){} // فتح النطق بعد لمسة المستخدم
  try{if(navigator.wakeLock){const lock=()=>navigator.wakeLock.request('screen').catch(()=>{});lock();document.addEventListener('visibilitychange',()=>{if(!document.hidden)lock();});}}catch(e){}
  if(!SR){$('#btnMic').disabled=true;$('#btnMic').title='غير مدعوم في هذا المتصفح';}
  const veil=h('div.veil',h('div.box',h('div.spin'),h('h2',null,'جارٍ تجهيز المساعد…'),h('p#veilMsg',null,'تحميل نماذج التعرّف على الوجه (مرة واحدة تقريباً)')));
  $('#overlays').append(veil);
  let camErr=null,aiErr=null;
  try{await Vision.startCamera();}catch(e){camErr=e;}
  if(!camErr){ try{await Vision.loadModels();}catch(e){aiErr=e;console.warn(e);} }
  veil.remove();
  if(camErr){UI.sys(camErr.message==='insecure'?'الكاميرا تحتاج اتصال HTTPS. المساعد يعمل بالكتابة والصوت فقط.':'تعذّر تشغيل الكاميرا (تحقق من الإذن). المساعد يعمل بالكتابة والصوت فقط.');$('#camBox').classList.add('off');}
  else if(aiErr) UI.sys('تعذّر تحميل نماذج التعرّف على الوجه (تحقق من الإنترنت). المساعد يعمل بدون التعرّف على الوجه.');
  else Vision.run();
  UI.session();
  UI.bot({say:`أهلاً! أنا ${S.settings.botName}، مساعد ${S.settings.libraryName}. ${Vision.ready?'قرّب وشك من الكاميرا وأنا هعرفك، أو اضغط على الميكروفون':'اضغط على الميكروفون أو اكتب'} واسألني عن أي كتاب.`,books:[]});
  setInterval(()=>App.idle(Date.now()),2000);
  App.micOn=false;
}

/* ---------- الأحداث ---------- */
$('#btnSend').addEventListener('click',()=>{const t=$('#txt').value;$('#txt').value='';App.ask(t);});
$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('#btnSend').click();}});
$('#btnMic').addEventListener('click',()=>{
  if(!Ear.supported) return toast('المتصفح لا يدعم التعرّف على الصوت. استخدم Chrome أو اكتب سؤالك.');
  App.micOn=!App.micOn; UI.mic(App.micOn);
  if(App.micOn){App.ensureSession();Ear.enable();}else Ear.disable();
});
$('#btnCam').addEventListener('click',async()=>{
  if(Vision.camOn){Vision.stopCamera();$('#btnCam').setAttribute('aria-pressed','false');App.endSession('left');UI.session();return;}
  try{await Vision.startCamera();$('#btnCam').setAttribute('aria-pressed','true');if(!Vision.ready)await Vision.loadModels();Vision.run();}
  catch(e){toast('تعذّر تشغيل الكاميرا.');}
});
$('#btnFull').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});});
$('#btnAdmin').addEventListener('click',async()=>{if(await askPassword('أدخل كلمة المرور لفتح لوحة الإدارة.'))Admin.open();});
$('#adminClose').addEventListener('click',()=>Admin.close());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#admin').hidden)Admin.close();});
window.addEventListener('beforeunload',()=>{if(S&&Vault.key)Vault.flush().catch(()=>{});});
boot();
})();
</script>
</body>
